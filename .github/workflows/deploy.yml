# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Lowercase the owner once and expose it to all downstream jobs.
  # Docker image refs (ghcr.io/<owner>/<image>) require lowercase.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.lc.outputs.owner_lc }}
    steps:
      - id: lc
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner_lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.medusa
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/hanoot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-storefront:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.storefront
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/hanoot-storefront:latest
          build-args: |
            MEDUSA_BACKEND_URL=https://srv1162617.hstgr.cloud

  build-vendor:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.vendor
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/hanoot-vendor:latest

  deploy:
    needs: [prepare, build-backend, build-storefront, build-vendor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq + envsubst
        run: sudo apt-get update && sudo apt-get install -y jq gettext-base
      - name: Deploy to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          GITHUB_USERNAME: ${{ needs.prepare.outputs.owner_lc }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          STORE_CORS: https://srv1162617.hstgr.cloud
          ADMIN_CORS: https://srv1162617.hstgr.cloud
          AUTH_CORS: https://srv1162617.hstgr.cloud
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
        run: bash deploy/hostinger-deploy.sh
