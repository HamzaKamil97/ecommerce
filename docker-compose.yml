# Optional: only needed if you decide to switch from native Postgres to Docker later.
# For this MVP, Postgres is installed natively on Windows.

services:
  postgres:
    image: postgres:16
    container_name: ecommerce_mvp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ecommerce_mvp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
